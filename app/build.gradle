plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sentinelcomms.kfdmobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.sentinelcomms.kfdmobile"
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName "0.6.5"
    }

    // Upload-key signing. Values come from ~/.gradle/gradle.properties (outside the
    // repo) so the keystore path and passwords are never committed. If they are
    // absent, release builds are produced unsigned.
    def hasUploadKey = ['KFDMOBILE_KEYSTORE', 'KFDMOBILE_STORE_PASSWORD',
                        'KFDMOBILE_KEY_ALIAS', 'KFDMOBILE_KEY_PASSWORD'].every { project.hasProperty(it) }
    signingConfigs {
        release {
            if (hasUploadKey) {
                storeFile     file(project.property('KFDMOBILE_KEYSTORE'))
                storePassword project.property('KFDMOBILE_STORE_PASSWORD')
                keyAlias      project.property('KFDMOBILE_KEY_ALIAS')
                keyPassword   project.property('KFDMOBILE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (hasUploadKey) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "KFDMobile-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    // USB serial for Arduino/CDC-ACM devices
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}
